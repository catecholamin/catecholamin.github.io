    {%- if site.cf_analytics_github_token and site.cf_analytics_pages_token %}
    <!-- Cloudflare Web Analytics：按访问域名分发 token，三个入口分开计数 -->
    <script>
    (function () {
      var h = location.hostname;
      // 本地预览不统计
      if (/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(h)) return;
      var token;
      if (/^996196\.xyz$/i.test(h)) {
        // 主站
        token = {{ site.cf_analytics_xyz_token | jsonify }};
      } else if (/github\.io$/i.test(h)) {
        // GitHub Pages 备份入口
        token = {{ site.cf_analytics_github_token | jsonify }};
      } else {
        // Cloudflare Pages 默认子域名
        token = {{ site.cf_analytics_pages_token | jsonify }};
      }
      if (!token) return;
      var s = document.createElement('script');
      s.type = 'module';
      s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
      s.setAttribute('data-cf-beacon', JSON.stringify({ token: token }));
      document.head.appendChild(s);
    })();
    </script>
    <!-- End Cloudflare Web Analytics -->
    {%- endif %}
