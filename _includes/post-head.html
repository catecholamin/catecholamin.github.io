<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    {% include seo.html %}
    <link rel="stylesheet" href="//cdn.staticfile.org/normalize/6.0.0/normalize.min.css">
    <link rel="stylesheet" href="//at.alicdn.com/t/font_roc50gemkxpw4s4i.css">
    <link rel="stylesheet" href="{{ "/assets/css/github-markdown.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/prism.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/share.min.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/app.min.css" | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/search-overlay.css?v=2" | relative_url }}">
    <link rel="stylesheet" href="https://cdn.bootcss.com/font-awesome/4.7.0/css/font-awesome.min.css">
    {% if page.cover %}<link rel="preload" as="image" href="{{ page.cover | relative_url }}" fetchpriority="high">{% endif %}
    <script src="{{ "/assets/js/jquery.min.js" | relative_url }}"></script>
	{% if site.mathjax %}
	{% include mathjax.html %}
	{% endif %}
    {% include anchor.html %}
    <style>
    /* 图片出处：做成图注而不是正文段落。
       必须带 .markdown-body 前缀 —— 主题里 .markdown-body p 的
       font-size:17px / text-align:justify 权重 (0,1,1)，高过单写 .image-credit
       的 (0,1,0)，只写类选择器会被正文规则整条压掉，看上去毫无变化。 */
    .markdown-body p.image-credit,
    p.image-credit {
        font-size: 12.5px;
        color: #b0b0b0;
        text-align: right;
        margin: -4px 0 20px;
        font-style: normal;
        font-weight: 400;
        line-height: 1.55;
        letter-spacing: 0.01em;
    }
    @media (max-width: 768px) {
        .markdown-body p.image-credit,
        p.image-credit { font-size: 12px; margin-bottom: 16px; }
    }
    </style>
</head>
