<header class="g-header">
    <div class="g-logo">
      <a href="{{ "/" | relative_url }}"></a>
    </div>
    <i id="menu-toggle" class="iconfont icon-menu"></i>
    <!-- 移动端专用：搜索图标常驻，不需要先展开汉堡菜单。
         桌面上这个按钮隐藏，用 .g-nav 里那个就行。 -->
    <a href="/search.html" class="mobile-search" id="mobile-search" title="搜索" aria-label="搜索">
        <i class="iconfont icon-search"></i>
    </a>
    <nav class="g-nav">
        <ul>
            {% for i in site.nav %}
            <li><a href="{{ i[1] | relative_url}}">{{ i[0] }}</a></li>
            {% endfor %}
            <li class="nav-search">
                <a href="/search.html" title="搜索">
                    <i class="iconfont icon-search"></i>
                </a>
            </li>
        </ul>
    </nav>
</header>

<!-- Search Overlay -->
<!-- 交互逻辑统一放在 /assets/js/search-overlay.js，这里只保留结构。
     以前这里还有一段内联脚本做几乎相同的事，两套并存会互相打脸：
     内联那段用 querySelector 只抓第一个 .nav-search a，
     移动端菜单是后插入的，抓不到就会走默认的 href 跳转。
     注释掉容易忘，所以直接删掉，只留一处实现。 -->
<div class="search-overlay" id="search-overlay">
    <div class="search-overlay-inner">
        <div class="search-overlay-header">
            <input type="text" id="search-input" class="search-input" placeholder="输入关键词，即时搜索..." autocomplete="off">
            <button class="search-close" id="search-close" aria-label="关闭搜索"><i class="iconfont icon-close"></i></button>
        </div>
        <div class="search-result" id="search-result"></div>
        <div class="search-hint" id="search-hint">输入关键词，搜索标题、标签与全文</div>
    </div>
</div>
