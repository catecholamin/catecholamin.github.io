<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect width="880" height="440" fill="#f7f8fa"/>

  <!-- 标题 -->
  <text x="440" y="46" text-anchor="middle" font-size="21" font-weight="600" fill="#2c3e50">同一篇博客，两条不同的路</text>
  <text x="440" y="72" text-anchor="middle" font-size="13" fill="#8a94a6">访客在中国大陆，服务器在海外</text>

  <!-- ============ 左：GitHub Pages ============ -->
  <rect x="40" y="100" width="380" height="300" rx="8" fill="#ffffff" stroke="#e7eaf1"/>
  <text x="230" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#c0392b">迁移前 · GitHub Pages</text>

  <!-- 用户 -->
  <circle cx="230" cy="170" r="20" fill="#eef4fb" stroke="#1494fb" stroke-width="1.5"/>
  <text x="230" y="176" text-anchor="middle" font-size="15">👤</text>
  <text x="230" y="207" text-anchor="middle" font-size="11.5" fill="#7a8699">国内访客</text>

  <!-- 绕路箭头 -->
  <path d="M 230 215 C 230 262, 340 250, 348 268 C 356 286, 300 292, 230 300"
        fill="none" stroke="#e0908a" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M 230 300 L 226 291 M 230 300 L 237 293" fill="none" stroke="#e0908a" stroke-width="2" stroke-linecap="round"/>

  <text x="352" y="245" font-size="11" fill="#c0392b">绕道海外</text>
  <text x="352" y="262" font-size="11" fill="#c0392b">+3～4 秒</text>

  <!-- 服务器 -->
  <rect x="150" y="305" width="160" height="44" rx="6" fill="#fdf2f1" stroke="#e0908a"/>
  <text x="230" y="325" text-anchor="middle" font-size="12.5" fill="#c0392b">GitHub 美国节点</text>
  <text x="230" y="342" text-anchor="middle" font-size="10.5" fill="#b08a86">无中国大陆节点</text>

  <!-- 结果 -->
  <text x="230" y="378" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="600">实测 3 次仅 1 次成功</text>

  <!-- ============ 右：Cloudflare Pages ============ -->
  <rect x="460" y="100" width="380" height="300" rx="8" fill="#ffffff" stroke="#e7eaf1"/>
  <text x="650" y="130" text-anchor="middle" font-size="15" font-weight="600" fill="#1e7e5a">迁移后 · Cloudflare Pages</text>

  <!-- 用户 -->
  <circle cx="650" cy="170" r="20" fill="#eef4fb" stroke="#1494fb" stroke-width="1.5"/>
  <text x="650" y="176" text-anchor="middle" font-size="15">👤</text>
  <text x="650" y="207" text-anchor="middle" font-size="11.5" fill="#7a8699">国内访客</text>

  <!-- 直连箭头 -->
  <line x1="650" y1="215" x2="650" y2="300" stroke="#4caf82" stroke-width="2.5"/>
  <path d="M 650 306 L 645 295 M 650 306 L 655 295" fill="none" stroke="#4caf82" stroke-width="2.5" stroke-linecap="round"/>

  <text x="664" y="250" font-size="11" fill="#1e7e5a">就近接入</text>
  <text x="664" y="267" font-size="11" fill="#1e7e5a">0.7～2 秒</text>

  <!-- 服务器 -->
  <rect x="570" y="305" width="160" height="44" rx="6" fill="#eef9f3" stroke="#4caf82"/>
  <text x="650" y="325" text-anchor="middle" font-size="12.5" fill="#1e7e5a">边缘节点 HK / TW / SG</text>
  <text x="650" y="342" text-anchor="middle" font-size="10.5" fill="#5f9d80">国内走最近一跳</text>

  <!-- 结果 -->
  <text x="650" y="378" text-anchor="middle" font-size="12" fill="#1e7e5a" font-weight="600">实测 10 次全部成功</text>

  <!-- 底注 -->
  <text x="440" y="424" text-anchor="middle" font-size="11" fill="#9aa4b5">首字节时间，同一台机器、同一网络环境下连续测量</text>
</svg>
